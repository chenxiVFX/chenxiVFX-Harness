name: Cross-platform offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --editable .

      - name: Verify installed CLI and UTF-8 mock interaction
        run: python scripts/selfcheck.py

      - name: Verify prompt_toolkit TUI with synthetic keyboard input
        run: python scripts/tui_selfcheck.py

      - name: Compile project and tests
        run: python -m compileall -q src tests scripts

      - name: Run offline tests
        run: python -m unittest discover -s tests -v
