name: Cross-platform offline tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-locked verification-only pytest from official PyPI
        run: >-
          python -m pip --isolated install --disable-pip-version-check --require-hashes
          --only-binary=:all: --index-url https://pypi.org/simple
          -r packaging/verification-test-requirements.txt

      - name: Install package
        run: python -m pip install --editable .

      - name: Verify installed CLI and UTF-8 mock interaction
        run: python scripts/selfcheck.py

      - name: Verify prompt_toolkit TUI with synthetic keyboard input
        run: python scripts/tui_selfcheck.py

      - name: Run synthetic unittest and pytest user profiles
        run: python scripts/test_runner_selfcheck.py

      - name: Compile project and tests
        run: python -m compileall -q src tests scripts

      - name: Run offline tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/offline-tests.log"

      - name: Run offline tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP "offline-tests.log"
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath $testLog
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            $summary = ((Get-Content $testLog -Tail 25) -join "`n")
            $summary = $summary.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Offline test failure::$summary"
          }
          exit $testExitCode
