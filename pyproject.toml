[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chenxivfx-harness"
version = "0.5.0"
description = "Windows-first Chinese AI coding harness prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit==3.0.53",
    "wcwidth==0.9.2",
]

[project.scripts]
cvfx-harness = "cvfx_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
